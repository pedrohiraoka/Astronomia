[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astropyflow"
version = "0.1.0"
description = "Aplicação Python modular para demonstração de uso de Python na Astronomia"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AstroPyFlow Team", email = "contact@astropyflow.dev"}
]
keywords = ["astronomy", "astrophysics", "visualization", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=5.0",
    "matplotlib>=3.5",
    "numpy>=1.21",
    "pandas>=1.3",
    "rich>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.10",
]

[project.urls]
Homepage = "https://github.com/astropyflow/astropyflow"
Documentation = "https://astropyflow.readthedocs.io"
Repository = "https://github.com/astropyflow/astropyflow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=src/astropyflow --cov-report=term-missing"
